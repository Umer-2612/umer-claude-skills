# Generic CI workflow — four pillars (lint, typecheck, test, build).
# Copy to .github/workflows/ci.yml and fill in placeholders marked with `# <...>`.
#
# Notes:
# - Third-party actions are pinned to full commit SHAs. Verify and update on each
#   major version bump — see https://docs.github.com/en/actions/security-guides
# - `runs-on` defaults to ubuntu-latest. Add macOS/Windows via matrix if needed.
# - Adjust `cache` step for your package manager.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR when a new push arrives.
# Never cancel runs on main — we want full signal on the trunk.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # - name: Set up toolchain
      #   uses: <setup action for your language, e.g. actions/setup-node@SHA>
      #   with:
      #     # <version, cache key, etc.>
      - name: Lint
        run: |
          # <your lint command, e.g. `npm run lint`, `ruff check .`, `golangci-lint run`>
          echo "REPLACE_ME: lint command"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # - name: Set up toolchain
      #   uses: <setup action>
      - name: Typecheck
        run: |
          # <your typecheck command, e.g. `npm run typecheck`, `mypy .`, `tsc --noEmit`>
          # Skip this job entirely if your language is untyped.
          echo "REPLACE_ME: typecheck command"

  test:
    runs-on: ubuntu-latest
    # Uncomment to test across multiple versions or platforms:
    # strategy:
    #   fail-fast: ${{ github.event_name == 'pull_request' }}
    #   matrix:
    #     version: ['20', '22']
    #     os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # - name: Set up toolchain
      #   uses: <setup action>
      - name: Test
        run: |
          # <your test command, e.g. `npm test`, `pytest`, `go test ./...`, `cargo test`>
          echo "REPLACE_ME: test command"

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # - name: Set up toolchain
      #   uses: <setup action>
      - name: Build
        run: |
          # <your build command, e.g. `npm run build`, `cargo build --release`, `go build ./...`>
          echo "REPLACE_ME: build command"
      # Optional: upload the build artifact for downstream jobs (deploy, release).
      # Add `actions/upload-artifact@<sha> # <version>` here, pinned to the latest
      # release commit SHA from https://github.com/actions/upload-artifact/releases
